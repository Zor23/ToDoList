<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <div class="app">
        <h1>To-Do List</h1>

        <form id="form-tugas" class="form-tugas">
            <input type="text" id="input-tugas" placeholder="Tulis tugas baru..." autocomplete="off" />
            <button type="submit">Tambah</button>
        </form>

        <div class="filter">
            <button class="filter-btn active" data-filter="semua">Semua</button>
            <button class="filter-btn" data-filter="aktif">Aktif</button>
            <button class="filter-btn" data-filter="selesai">Selesai</button>
        </div>

        <ul id="daftar-tugas" class="daftar-tugas"></ul>

        <p id="kosong" class="kosong">Belum ada tugas. Tambahkan yuk!</p>

        <div class="footer">
            <span id="sisa-tugas">0 tugas tersisa</span>
            <button id="hapus-selesai">Hapus yang selesai</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
